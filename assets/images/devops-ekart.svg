<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1117;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2874F0;stop-opacity:0.85" />
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#bg)" rx="12"/>
  <!-- Grid pattern -->
  <g opacity="0.06">
    <line x1="0" y1="50" x2="600" y2="50" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="100" x2="600" y2="100" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="150" x2="600" y2="150" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="200" x2="600" y2="200" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="250" x2="600" y2="250" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="300" x2="600" y2="300" stroke="white" stroke-width="0.5"/>
    <line x1="0" y1="350" x2="600" y2="350" stroke="white" stroke-width="0.5"/>
    <line x1="100" y1="0" x2="100" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="200" y1="0" x2="200" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="400" y1="0" x2="400" y2="400" stroke="white" stroke-width="0.5"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="white" stroke-width="0.5"/>
  </g>
  <!-- DevOps icons decoration -->
  <g opacity="0.08" fill="white">
    <circle cx="520" cy="60" r="30"/>
    <circle cx="80" cy="340" r="25"/>
    <rect x="40" y="40" width="40" height="40" rx="8"/>
    <rect x="500" y="310" width="50" height="50" rx="10"/>
  </g>
  <!-- Emoji icon -->
  <text x="300" y="140" font-size="72" text-anchor="middle" filter="url(#shadow)">🛒</text>
  <!-- Title -->
  <text x="300" y="220" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle" filter="url(#shadow)">Ekart</text>
  <!-- Subtitle -->
  <text x="300" y="260" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="rgba(255,255,255,0.8)" text-anchor="middle">CI/CD & Kubernetes</text>
  <!-- Badge -->
  <rect x="210" y="290" width="180" height="36" rx="18" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="300" y="314" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="white" text-anchor="middle" letter-spacing="1.5">DevOps · CI/CD · K8s</text>
</svg>